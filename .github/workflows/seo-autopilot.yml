name: SEO Autopilot (On-Page-Optimierung)

on:
  schedule:
    - cron: '0 7 * * 1,4'  # Mo + Do 08:00 CET (= 07:00 UTC)
  workflow_dispatch:        # auch manuell auslösbar

jobs:
  seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run SEO Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'SEO Autopilot'
          GIT_AUTHOR_EMAIL: 'actions@github.com'
          GIT_COMMITTER_NAME: 'SEO Autopilot'
          GIT_COMMITTER_EMAIL: 'actions@github.com'
        run: |
          TODAY=$(date +%Y-%m-%d)
          claude --dangerously-skip-permissions -p "
          Du bist der technische SEO-Architekt für boatpass.de.
          Deine Aufgabe: die Codebase auf On-Page-SEO-Potenziale analysieren, eine
          gezielte Verbesserung vornehmen und als Pull Request einreichen.

          Das Projektverzeichnis: $(pwd)
          Die Fokus-Keywords: SBF Binnen, SBF See, Funkzeugnis (UBI/SRC), Bootsführerschein.

          Lies zuerst docs/seo-geo-strategie-2026.md vollständig. Dort stehen die
          strategischen Prioritäten, bereits umgesetzte Maßnahmen und die echten Lücken.

          Falls docs/seo-automation/gsc-findings.md existiert, lies es ebenfalls: Es enthält
          echte Search-Console-Daten (Striking-Distance-Keywords, CTR-Schwächen) und hat
          Vorrang – wähle deine Schwachstelle bevorzugt so, dass sie eine dort gelistete
          Seite oder Query stärkt.

          ## SEO-Schwachstellen (priorisiert A → D, wähle genau EINE):

          A) Fehlende oder nicht optimierte <title> bzw. <meta name='description'>
             Prüfe src/pages/ und src/layouts/. Titel: 50–60 Zeichen, Fokus-Keyword vorne.
             Meta-Description: 140–155 Zeichen, handlungsauffordernde Formulierung.
             Jede Seite braucht einen einzigartigen Titel und eine einzigartige Description.

          B) Fehlende alt-Attribute in <img> oder <Image>-Tags
             Prüfe src/ rekursiv. Alt-Text: beschreibend + Fokus-Keyword wo natürlich.
             Dekorative Bilder: alt='' (leerer String, kein Weglassen).

          C) Fehlende oder schwache strukturierte Daten (JSON-LD)
             Prüfe ob Seiten mit Prüfungsfragen, Erklärungen oder Schritt-Anleitungen
             ein FAQPage- oder HowTo-Schema haben. Ergänze wo es sinnvoll fehlt.
             Referenz: Das Strategie-Dokument listet bereits umgesetzte Schemas – nicht doppelt anlegen.

          D) Fehlende interne Verlinkungen
             Prüfe ob Pillar-Seiten (sbf-binnen.astro, sbf-see.astro, src.astro) auf
             thematisch verwandte Blogposts verlinken und umgekehrt. Füge max. 2–3
             kontextuelle Links pro Datei ein – nur wenn sie natürlich wirken.

          ## Regeln:
          - Genau EINE Schwachstelle beheben, vollständig.
          - Keine Layout-Klassen (Tailwind) ändern.
          - EN/DE-Parität: Falls eine de-Datei geändert wird, die entsprechende en-Datei
            (gleicher Pfad mit /en/-Präfix) inhaltlich äquivalent auf Englisch anpassen.
          - npm ci && npm run build muss mit Exit Code 0 durchlaufen. Fehler selbst beheben.
          - Branch erstellen: chore/seo-${TODAY}-<kurzes-thema>
          - Änderungen committen und pushen (git push origin <branch>).
          - PR gegen main erstellen via: gh pr create --title 'chore(seo): ...' --body '...'
            PR-Body: Welches Problem behoben? Welche Keywords gestärkt? Welche Dateien geändert?

          ## Erfolgskriterien:
          - Build fehlerfrei
          - Genau eine Schwachstelle vollständig behoben
          - Branch gepusht und PR erstellt
          - Keine Layout-Änderungen
          - EN/DE-Parität eingehalten
          "
