name: Content Refresh (Blogpost-Aktualisierung)

on:
  schedule:
    - cron: '0 6 1,15 * *'  # am 1. und 15. des Monats, 07:00/08:00 DE
  workflow_dispatch:         # auch manuell auslösbar

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Content-Refresh Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'Content Refresh'
          GIT_AUTHOR_EMAIL: 'actions@github.com'
          GIT_COMMITTER_NAME: 'Content Refresh'
          GIT_COMMITTER_EMAIL: 'actions@github.com'
        run: |
          TODAY=$(date +%Y-%m-%d)
          claude --dangerously-skip-permissions -p "
          Du bist der Content-Redakteur für boatpass.de. Deine Aufgabe: genau EINEN
          bestehenden Blogpost inhaltlich auffrischen und als Pull Request einreichen.
          Google belohnt gepflegte, aktuelle Inhalte – ein guter Refresh wirkt oft
          stärker als ein neuer Post.

          Das Projektverzeichnis: $(pwd)
          Die Blogposts: src/content/blog/de/ und src/content/blog/en/
          Das Fokus-Thema: SBF Binnen, SBF See, Funkzeugnis (UBI/SRC), Bootsführerschein.

          ## Schritt 1 – Post auswählen:

          Effektives Alter pro Post = Frontmatter-Feld 'updated' falls vorhanden, sonst 'date'.
          Priorität:
          1. Falls docs/seo-automation/gsc-findings.md existiert und dort ein Blogpost als
             Striking-Distance- oder CTR-Schwäche gelistet ist: nimm diesen.
          2. Sonst: der Post mit dem ältesten effektiven Alter.
          Posts, deren effektives Alter jünger als 60 Tage ist, überspringen. Wenn kein
          Post älter als 60 Tage ist, beende ohne Änderung mit einer kurzen Begründung.

          ## Schritt 2 – Refresh durchführen (DE- und EN-Version desselben Posts):

          - Fakten prüfen: Zahlen, Gebühren, Fristen, Rechtsgrundlagen (WebSearch nutzen,
            offizielle Quellen wie elwis.de, BMDV, DMYV, DSV bevorzugen). Veraltetes
            korrigieren, Unbelegtes entschärfen.
          - Inhalt vertiefen: 1-3 neue, substanzielle Abschnitte oder Erweiterungen, die
            echte Leserfragen beantworten (kein Fülltext, keine Wiederholungen).
          - Falls sinnvoll und noch nicht vorhanden: 'faq'-Frontmatter (2-4 Paare) ergänzen –
            Fragen/Antworten müssen den sichtbaren Artikelinhalt widerspiegeln.
          - Interne Links prüfen: 1-2 kontextuelle Links auf Pillar-Seiten oder thematisch
            passende neuere Posts ergänzen, wo natürlich.
          - Frontmatter aktualisieren: 'updated: ${TODAY}' setzen (Feld 'date' NICHT ändern),
            'readingTime' an die neue Länge anpassen, 'description' nachschärfen falls schwach.

          ## Regeln:
          - Genau EIN Post (in beiden Sprachen), vollständig.
          - EN/DE-Parität ist Pflicht: beide Sprachversionen müssen nach dem Refresh
            inhaltlich äquivalent sein (gleiche Abschnitte, gleiche Fakten, gleiche FAQ).
          - Ton und Stil des Bestands beibehalten (du-Ansprache in DE, klar, faktenbasiert).
          - Keine Layout-Klassen (Tailwind) ändern, keine Emojis.
          - npm ci && npm run build muss mit Exit Code 0 durchlaufen. Fehler selbst beheben.
          - Branch erstellen: chore/refresh-${TODAY}-<post-slug>
          - Änderungen committen und pushen (git push origin <branch>).
          - PR gegen main erstellen via: gh pr create --title 'chore(refresh): ...' --body '...'
            PR-Body: Welcher Post und warum? Was wurde faktisch korrigiert? Was ergänzt?

          ## Erfolgskriterien:
          - Fakten belegt oder korrigiert, substanzielle Erweiterung, kein Fülltext
          - 'updated' gesetzt, 'readingTime' angepasst, EN/DE-Parität eingehalten
          - Build fehlerfrei, Branch gepusht, PR erstellt
          "
