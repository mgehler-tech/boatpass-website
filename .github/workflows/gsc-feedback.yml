name: GSC Feedback Loop (Search-Console-Analyse)

on:
  schedule:
    - cron: '30 5 * * 1'  # Mo 06:30/07:30 DE – vor dem SEO Autopilot (Mo 07:00 UTC)
  workflow_dispatch:       # auch manuell auslösbar

jobs:
  gsc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Search-Console-Daten
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: 'sc-domain:boatpass.de'
        run: node scripts/fetch-gsc-data.mjs

      # Deterministische Auswertung – kein LLM, keine Code-Änderungen. Schreibt nur
      # docs/seo-automation/gsc-findings.md. Bewertung/Umsetzung passiert manuell,
      # damit der wöchentliche git diff der Findings aussagekräftig bleibt.
      - name: Findings erzeugen
        run: node scripts/analyze-gsc-data.mjs

      # Rohreport (~200 KB) NICHT ins Repo committen – als Artefakt anhängen, 90 Tage.
      - name: Rohreport als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: gsc-report
          path: /tmp/gsc-report.json
          retention-days: 90

      - name: Findings committen (nur bei Änderung)
        run: |
          if git diff --quiet -- docs/seo-automation/gsc-findings.md; then
            echo "Keine Änderung an gsc-findings.md."
            exit 0
          fi
          git config user.name 'GSC Feedback Loop'
          git config user.email 'actions@github.com'
          git add docs/seo-automation/gsc-findings.md
          git commit -m "chore(gsc): Findings-Update $(date +%Y-%m-%d)"
          git push
