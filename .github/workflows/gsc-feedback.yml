name: GSC Feedback Loop (Search-Console-Analyse)

on:
  schedule:
    - cron: '30 5 * * 1'  # Mo 06:30/07:30 DE – vor dem SEO Autopilot (Mo 07:00 UTC)
  workflow_dispatch:       # auch manuell auslösbar

jobs:
  gsc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Fetch Search-Console-Daten
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: 'sc-domain:boatpass.de'
        run: node scripts/fetch-gsc-data.mjs

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run GSC Analyst
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 'GSC Feedback Loop'
          GIT_AUTHOR_EMAIL: 'actions@github.com'
          GIT_COMMITTER_NAME: 'GSC Feedback Loop'
          GIT_COMMITTER_EMAIL: 'actions@github.com'
        run: |
          TODAY=$(date +%Y-%m-%d)
          claude --dangerously-skip-permissions -p "
          Du bist der SEO-Analyst für boatpass.de. Deine Aufgabe: echte Search-Console-Daten
          auswerten, daraus priorisierte Findings ableiten und genau EINE gezielte
          On-Page-Verbesserung als Pull Request einreichen.

          Das Projektverzeichnis: $(pwd)
          Der Daten-Report: /tmp/gsc-report.json (Search Analytics, letzte 28 Tage plus
          Vorperiode; Felder: queries, pages, queryPage, prevQueries, prevPages; Metriken
          pro Zeile: clicks, impressions, ctr, position).

          ## Schritt 1 – Analyse (Report lesen, mit jq oder node auswerten):

          A) Striking-Distance-Keywords: Queries mit Position 4–15 und relevanten
             Impressionen (>50). Das sind die Rankings, die mit wenig Aufwand auf
             Seite 1 / in die Top 3 zu heben sind. Sortiere nach Impressionen.

          B) CTR-Schwächen: Seiten mit hohen Impressionen aber CTR deutlich unter dem
             Erwartungswert ihrer Position (Faustregel: Pos 1-3 >15 %, Pos 4-10 >4 %).
             Ursache meist: schwacher Title oder Meta-Description im SERP.

          C) Gewinner/Verlierer: Vergleiche queries mit prevQueries. Queries mit klarem
             Positions- oder Klickverlust benennen; ebenso die stärksten Aufsteiger.

          D) Themen-Chancen: Queries mit Impressionen, zu denen keine eigene Seite gezielt
             rankt (queryPage prüfen) – Kandidaten für neue Blogposts.

          ## Schritt 2 – Findings-Dokument schreiben:

          Schreibe/überschreibe docs/seo-automation/gsc-findings.md mit:
          - Datum und Analysezeitraum
          - Top 10 Striking-Distance-Keywords (Tabelle: Query, Position, Impressionen,
            zugehörige Seite, empfohlene Maßnahme)
          - Top 5 CTR-Schwächen (Tabelle: Seite, Position, Impressionen, CTR, Empfehlung)
          - Gewinner/Verlierer der Woche (kurz)
          - 3-5 Blogpost-Themenvorschläge aus D) für den Blog-Autopilot
          Dieses Dokument lesen SEO-Autopilot und Blog-Autopilot als Prioritätenliste –
          formuliere Maßnahmen konkret und umsetzbar (Datei nennen, wo möglich).

          ## Schritt 3 – EINE Verbesserung umsetzen:

          Wähle den größten Hebel aus A) oder B) und setze ihn um, z. B. Title/Meta-Description
          der betroffenen Seite nachschärfen (Fokus-Query nach vorn, 50-60 bzw. 140-155 Zeichen)
          oder einen fehlenden Abschnitt ergänzen, der die Query direkt beantwortet.

          ## Regeln:
          - Keine Layout-Klassen (Tailwind) ändern.
          - EN/DE-Parität: Falls eine de-Datei geändert wird, die entsprechende en-Datei
            (gleicher Pfad mit /en/-Präfix) inhaltlich äquivalent auf Englisch anpassen.
            (gsc-findings.md ist internes Doku – braucht keine EN-Version.)
          - npm ci && npm run build muss mit Exit Code 0 durchlaufen. Fehler selbst beheben.
          - Branch erstellen: chore/gsc-${TODAY}-<kurzes-thema>
          - Änderungen committen und pushen (git push origin <branch>).
          - PR gegen main erstellen via: gh pr create --title 'chore(gsc): ...' --body '...'
            PR-Body: Kernzahlen der Woche, wichtigste Findings, welche Verbesserung warum.

          ## Erfolgskriterien:
          - docs/seo-automation/gsc-findings.md aktualisiert, datenbasiert und konkret
          - Genau eine On-Page-Verbesserung umgesetzt
          - Build fehlerfrei, Branch gepusht, PR erstellt
          "
